<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EB Volt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="assets/hero-accra-1440w.jpg">
  <link rel="stylesheet" href="hero.css">
</head>
<body>

<!-- ============ HERO: copy this block into the page ============ -->
<section class="eb-hero">
  <div class="eb-hero__media"
       role="img"
       aria-label="EB Volt logo in a glowing electric pin above an aerial view of Accra at sunset"></div>
  <div class="eb-hero__scrim" aria-hidden="true"></div>

  <div class="eb-hero__inner">
    <h1 class="eb-hero__title">
      Charge Anywhere in <span class="accent">Ghana.</span><br>Arrive Confident.
    </h1>

    <p class="eb-hero__sub">
      The fastest way to charge your EV. <strong>Powered by the sun. Paid with MoMo.</strong>
      No bank account, no hassle. Just plug in and go.
    </p>

    <div class="eb-hero__cta">
      <a class="eb-btn eb-btn--primary" href="/chargers">Find a charger</a>
      <a class="eb-btn eb-btn--ghost" href="/app">Download the app</a>
    </div>

    <div class="eb-pay">
      <span class="eb-pay__label">Pay with</span>
      <span class="eb-chip"><span class="eb-chip__mark eb-chip__mark--mtn">MTN</span> MoMo</span>
      <span class="eb-chip"><span class="eb-chip__mark eb-chip__mark--tc">TC</span> Telecel Cash</span>
      <span class="eb-chip"><span class="eb-chip__mark eb-chip__mark--at">AT</span> AirtelTigo Money</span>
    </div>
  </div>
</section>
<!-- ============ END HERO ============ -->

</body>
</html>
